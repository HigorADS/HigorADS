<svg width="1400" height="390" viewBox="0 0 1400 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Higor System — Status Online</title>
  <desc>Banner programático com grade, brilho, scanline e terminal animado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070D"/><stop offset=".5" stop-color="#0B1426"/><stop offset="1" stop-color="#061B25"/>
    </linearGradient>
    <linearGradient id="title" x1="350" y1="110" x2="1050" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#D8FBFF"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#1E3A5F" stroke-opacity=".3"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="frame"><rect x="0" y="0" width="1400" height="390" rx="18"/></clipPath>
  </defs>
  <rect width="1400" height="390" rx="18" fill="url(#bg)"/>
  <rect width="1400" height="390" rx="18" fill="url(#grid)"/>
  <g clip-path="url(#frame)">
    <circle cx="1170" cy="94" r="170" fill="#06B6D4" fill-opacity=".07" filter="url(#soft)">
      <animate attributeName="r" values="150;185;150" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;.75;.35" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1170" cy="94" r="110" stroke="#38BDF8" stroke-opacity=".18" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0 1170 94" to="360 1170 94" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="1170" cy="94" r="145" stroke="#22D3EE" stroke-opacity=".1" stroke-dasharray="4 14"><animateTransform attributeName="transform" type="rotate" from="360 1170 94" to="0 1170 94" dur="24s" repeatCount="indefinite"/></circle>
    <path d="M-20 318C200 220 300 350 500 265C700 180 770 125 956 195C1140 264 1225 128 1430 148" stroke="#0EA5E9" stroke-opacity=".28" stroke-width="2"/>
    <rect x="-30" y="0" width="26" height="390" fill="#67E8F9" fill-opacity=".14"><animate attributeName="x" values="-30;1430" dur="7s" repeatCount="indefinite"/></rect>
    <g font-family="monospace">
      <text x="70" y="80" fill="#67E8F9" font-size="19">&gt;_ HIGOR SYSTEM</text>
      <circle cx="300" cy="73" r="5" fill="#22C55E" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <text x="70" y="166" fill="url(#title)" font-size="62" font-weight="700" filter="url(#glow)">STATUS: ONLINE</text>
      <text x="74" y="218" fill="#BAE6FD" font-size="25">Transformando aprendizado em código.<tspan fill="#22D3EE">▌</tspan><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></text>
      <text x="74" y="284" fill="#94A3B8" font-size="15">DISCIPLINA   •   APRENDIZADO   •   EVOLUÇÃO   •   RESULTADOS</text>
      <text x="1210" y="268" fill="#38BDF8" font-size="20">&gt;_</text>
      <text x="1210" y="296" fill="#22D3EE" font-size="14">build.future()</text>
      <text x="74" y="344" fill="#0EA5E9" font-size="14">[ SYSTEM.LOG ]</text>
      <text x="226" y="344" fill="#64748B" font-size="14">learning_mode = true</text>
    </g>
  </g>
  <rect x="1" y="1" width="1398" height="388" rx="18" stroke="#164E63" stroke-width="2"/>
</svg>
